name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      # 关键步骤1：打印出项目中所有的 Scheme，方便我们确认名字
      - name: List All Schemes (Debug)
        run: |
          echo "正在检查 App/AppProject.xcodeproj 中的可用方案..."
          xcodebuild -list -project App/AppProject.xcodeproj
      
      # 关键步骤2：因为根目录有 Package.swift，提前解析依赖，避免构建时卡死
      - name: Resolve Swift Packages
        run: |
          swift package resolve
          cd App && swift package resolve  # 也确保 App 子目录下的依赖被解析
      
      # 关键步骤3：编译未签名归档（强制清除所有签名相关的变量）
      - name: Build Unsigned Archive
        run: |
          xcodebuild clean archive \
            -project App/AppProject.xcodeproj \
            -scheme AppProject \
            -configuration Release \
            -archivePath build/AppProject.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--sign-less" \
            -skipPackagePluginValidation \
            -resolvePackageDependencies
      
      - name: Manually Package IPA
        run: |
          mkdir -p Payload
          cp -R build/AppProject.xcarchive/Products/Applications/AppProject.app Payload/
          zip -r TEXT.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
