name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14 # 尝试使用 macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2' # 指定一个稳定版本

      - name: Disable root SPM
        run: |
          if [ -f Package.swift ]; then mv Package.swift Package.swift.bak; fi
          if [ -f Package.resolved ]; then mv Package.resolved Package.resolved.bak; fi
          if [ -f .gitmodules ]; then mv .gitmodules .gitmodules.bak; fi

      - name: Clean DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ./DerivedData

      - name: List project info
        run: |
          echo "当前目录："
          ls -la
          echo "App 目录内容："
          ls -la App/
          echo "Xcode 项目可用 Schemes："
          xcodebuild -list -project App/AppProject.xcodeproj

      - name: Build .app (unsigned)
        run: |
          xcodebuild build \
            -project App/AppProject.xcodeproj \
            -scheme AppProject \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--sign-less"

      - name: Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "找到 .app 路径：$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TEXT.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
