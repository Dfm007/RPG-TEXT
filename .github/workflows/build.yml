name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 1. 清理可能干扰的旧文件
      - name: Clean up
        run: |
          rm -rf *.xcodeproj || true
          rm -rf .swiftpm || true
          rm -rf DerivedData || true

      # 2. 创建 Xcode 项目（包含完整配置）
      - name: Create Xcode project
        run: |
          mkdir -p TEXT.xcodeproj
          
          cat > TEXT.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {
              };
              objectVersion = 56;
              objects = {
                  /* Begin PBXFileReference section */
                  TEXTApp = {isa = PBXFileReference; lastKnownFileType = wrapper.application; name = TEXT.app; path = "Build/Products/Release-iphoneos/TEXT.app"; sourceTree = "<absolute>"; };
                  /* End PBXFileReference section */
                  
                  /* Begin PBXGroup section */
                  TEXT = {isa = PBXGroup; children = (); sourceTree = "<group>"; };
                  /* End PBXGroup section */
                  
                  /* Begin PBXProject section */
                  TEXTProject = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1600; LastUpgradeCheck = 1600; ORGANIZATIONNAME = ""; TargetAttributes = {TEXTTarget = {CreatedOnToolsVersion = 16.0;};};}; buildConfigurationList = BuildConfigList; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = TEXT; productRefGroup = Products; projectDirPath = ""; projectRoot = ""; targets = (TEXTTarget);};
                  /* End PBXProject section */
                  
                  /* Begin XCBuildConfiguration section */
                  Release = {isa = XCBuildConfiguration; buildSettings = {CODE_SIGN_IDENTITY = ""; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; INFOPLIST_FILE = "App/Info.plist"; IPHONEOS_DEPLOYMENT_TARGET = 16.0; LD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks"; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.example.TEXT; PRODUCT_NAME = TEXT; PROVISIONING_PROFILE_SPECIFIER = ""; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2";}; name = Release;};
                  /* End XCBuildConfiguration section */
                  
                  /* Begin XCConfigurationList section */
                  BuildConfigList = {isa = XCConfigurationList; buildConfigurations = (Release); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release;};
                  /* End XCConfigurationList section */
              };
              rootObject = TEXTProject;
          }
          EOF
          
          # 创建 Info.plist（如果不存在）
          if [ ! -f "App/Info.plist" ]; then
            mkdir -p App
            cat > App/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>TEXT</string>
              <key>CFBundleDisplayName</key>
              <string>TEXT</string>
              <key>CFBundlePackageType</key>
              <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          fi

      # 3. 使用 xcodebuild 构建（使用 -target 替代 -scheme）
      - name: Build .app (unsigned)
        run: |
          xcodebuild build \
            -project TEXT.xcodeproj \
            -target TEXTTarget \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0

      # 4. 打包 IPA
      - name: Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "✅ 找到 .app 路径：$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TEXT.ipa Payload/
          echo "✅ IPA 打包完成"

      # 5. 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
