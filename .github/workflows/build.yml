name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Unsigned Archive
        run: |
          xcodebuild clean archive \
            -project App/AppProject.xcodeproj \
            -scheme AppProject \
            -configuration Release \
            -archivePath build/AppProject.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Manually Package IPA
        run: |
          mkdir -p Payload
          cp -R build/AppProject.xcarchive/Products/Applications/AppProject.app Payload/
          zip -r TEXT.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
