name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 1. 清理可能干扰的文件
      - name: Clean up
        run: |
          rm -rf *.xcodeproj || true
          rm -rf .swiftpm || true
          rm -rf DerivedData || true
          rm -rf .build || true

      # 2. 解析 SPM 依赖（下载 ZIPFoundation）
      - name: Resolve dependencies
        run: |
          swift package resolve

      # 3. 使用 SPM 生成 Xcode 项目
      - name: Generate Xcode project
        run: |
          swift package generate-xcodeproj --output ./GeneratedProject

      # 4. 列出生成的 Scheme（用于调试，确认 Scheme 名称）
      - name: List available schemes
        run: |
          echo "=== 生成的 Xcode 项目内容 ==="
          ls -la ./GeneratedProject/
          echo "=== 可用的 Scheme 列表 ==="
          xcodebuild -list -project ./GeneratedProject/GeneratedProject.xcodeproj

      # 5. 动态获取 Scheme 名称
      - name: Get scheme name
        id: get_scheme
        run: |
          SCHEME=$(xcodebuild -list -project ./GeneratedProject/GeneratedProject.xcodeproj | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')
          echo "检测到的 Scheme 名称: $SCHEME"
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      # 6. 使用 xcodebuild 构建（包含 ZIPFoundation 依赖）
      - name: Build .app (unsigned)
        run: |
          xcodebuild build \
            -project ./GeneratedProject/GeneratedProject.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0

      # 7. 查找编译生成的 .app 并打包 IPA
      - name: Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            echo "尝试查找所有 .app 文件..."
            find . -name "*.app" -type d
            exit 1
          fi
          echo "✅ 找到 .app 路径：$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TEXT.ipa Payload/
          echo "✅ IPA 打包完成"

      # 8. 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
