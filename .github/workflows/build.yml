name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 1. 清理 DerivedData（避免缓存干扰）
      - name: Clean DerivedData
        run: |
          rm -rf ./DerivedData || true

      # 2. 列出项目中的所有 Scheme（调试用）
      - name: List available schemes
        run: |
          echo "=== App/AppProject.xcodeproj 中的 Schemes ==="
          xcodebuild -list -project App/AppProject.xcodeproj
          echo ""
          echo "=== 检查 Scheme 文件是否存在 ==="
          ls -la App/AppProject.xcodeproj/xcshareddata/xcschemes/ || echo "Scheme 目录不存在"

      # 3. 构建未签名的 .app
      - name: Build .app (unsigned)
        run: |
          xcodebuild build \
            -project App/AppProject.xcodeproj \
            -scheme AppProject \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0

      # 4. 查找并打包 IPA
      - name: Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "✅ 找到 .app 路径：$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TEXT.ipa Payload/
          echo "✅ IPA 打包完成"

      # 5. 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
