name: Build Unsigned IPA
on:
  push:
  workflow_dispatch:

# 强制 GitHub Actions 使用 Node.js 24 运行所有 JavaScript actions，消除弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 临时屏蔽根目录的 Package.swift，避免 xcodebuild 误将其当作工作区解析
      - name: Disable root SPM
        run: |
          if [ -f Package.swift ]; then mv Package.swift Package.swift.bak; fi
          if [ -f Package.resolved ]; then mv Package.resolved Package.resolved.bak; fi
          if [ -f .gitmodules ]; then mv .gitmodules .gitmodules.bak; fi

      # 查看当前目录结构和项目 Scheme（方便调试）
      - name: List project info
        run: |
          echo "当前目录："
          ls -la
          echo "App 目录内容："
          ls -la App/
          echo "Xcode 项目可用 Schemes："
          xcodebuild -list -project App/AppProject.xcodeproj

      # 直接编译 .app（不经过 Archive，对签名缺失更宽容）
      - name: Build .app (unsigned)
        run: |
          xcodebuild build \
            -project App/AppProject.xcodeproj \
            -scheme AppProject \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # 手动打包成 IPA（将 .app 放入 Payload 文件夹并压缩）
      - name: Package IPA
        run: |
          # 查找编译出的 .app 文件（通常在 DerivedData 中）
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "找到 .app 路径：$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TEXT.ipa Payload/

      # 上传 IPA 作为 Artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-unsigned
          path: TEXT.ipa
